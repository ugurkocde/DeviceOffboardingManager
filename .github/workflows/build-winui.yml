name: Build WinUI App

on:
  pull_request:
    paths:
      - 'src/DeviceOffboardingManager.WinUI/**'
      - 'DeviceOffboardingManager.WinUI.sln'
      - '.github/workflows/build-winui.yml'
  push:
    branches:
      - codex/v0.4-winui-app
    paths:
      - 'src/DeviceOffboardingManager.WinUI/**'
      - 'DeviceOffboardingManager.WinUI.sln'
      - '.github/workflows/build-winui.yml'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\src\DeviceOffboardingManager.WinUI\DeviceOffboardingManager.WinUI.csproj -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build .\src\DeviceOffboardingManager.WinUI\DeviceOffboardingManager.WinUI.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore
