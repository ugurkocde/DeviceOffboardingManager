name: Package WinUI MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.4.*'

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify scaffold and resources
        shell: pwsh
        run: ./tests/Verify-WinUIScaffold.ps1

      - name: Set package version
        shell: pwsh
        run: |
          $versionPrefix = '0.4.0'
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
            if ($tag -notmatch '^v(?<version>0\.4\.\d+)$') {
              throw "Release tag '$tag' is not a supported v0.4 semantic version."
            }
            $versionPrefix = $Matches.version
          }

          $appxVersion = "$versionPrefix.0"
          $manifestPath = Resolve-Path '.\src\DeviceOffboardingManager.WinUI\Package.appxmanifest'
          [xml]$manifest = Get-Content -Path $manifestPath -Raw
          $namespace = New-Object Xml.XmlNamespaceManager($manifest.NameTable)
          $namespace.AddNamespace('appx', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity = $manifest.SelectSingleNode('/appx:Package/appx:Identity', $namespace)
          if (-not $identity) {
            throw 'Package.appxmanifest does not contain an Identity element.'
          }
          $identity.SetAttribute('Version', $appxVersion)
          $manifest.Save($manifestPath)

          "VERSION_PREFIX=$versionPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APPX_PACKAGE_VERSION=$appxVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate signing inputs
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_SIGNING_CERT_PFX_BASE64: ${{ secrets.MSIX_SIGNING_CERT_PFX_BASE64 }}
          MSIX_SIGNING_CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_CERT_PASSWORD }}
        run: |
          $isTagBuild = $env:GITHUB_REF -like 'refs/tags/*'
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:MSIX_SIGNING_CERT_PFX_BASE64)
          $hasPublisher = -not [string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:MSIX_SIGNING_CERT_PASSWORD)

          if ($isTagBuild -and (-not $hasCertificate -or -not $hasPublisher -or -not $hasPassword)) {
            throw 'Tagged releases require MSIX_SIGNING_CERT_PFX_BASE64, MSIX_SIGNING_CERT_PASSWORD, and MSIX_PUBLISHER repository secrets.'
          }

          if ($hasCertificate -and (-not $hasPublisher -or -not $hasPassword)) {
            throw 'Signed builds require MSIX_SIGNING_CERT_PFX_BASE64, MSIX_SIGNING_CERT_PASSWORD, and MSIX_PUBLISHER together.'
          }
          if (-not $hasCertificate -and ($hasPublisher -or $hasPassword)) {
            throw 'MSIX_PUBLISHER and MSIX_SIGNING_CERT_PASSWORD must not be configured without MSIX_SIGNING_CERT_PFX_BASE64.'
          }

          "HAS_SIGNING_CERT=$($hasCertificate.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Decode certificate and set package publisher
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_SIGNING_CERT_PFX_BASE64: ${{ secrets.MSIX_SIGNING_CERT_PFX_BASE64 }}
          MSIX_SIGNING_CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'msix-signing-cert.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_SIGNING_CERT_PFX_BASE64))

          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:MSIX_SIGNING_CERT_PASSWORD,
            $flags)

          if (-not $certificate.HasPrivateKey) {
            throw 'The configured MSIX signing certificate does not contain a private key.'
          }
          if ($certificate.NotAfter -le [DateTime]::UtcNow) {
            throw "The configured MSIX signing certificate expired on $($certificate.NotAfter.ToString('u'))."
          }
          if ($certificate.Subject -cne $env:MSIX_PUBLISHER) {
            throw "MSIX_PUBLISHER must exactly match the certificate subject. Expected '$($certificate.Subject)'."
          }

          $manifestPath = Resolve-Path '.\src\DeviceOffboardingManager.WinUI\Package.appxmanifest'
          [xml]$manifest = Get-Content -Path $manifestPath -Raw
          $namespace = New-Object Xml.XmlNamespaceManager($manifest.NameTable)
          $namespace.AddNamespace('appx', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity = $manifest.SelectSingleNode('/appx:Package/appx:Identity', $namespace)
          if (-not $identity) {
            throw 'Package.appxmanifest does not contain an Identity element.'
          }
          $identity.SetAttribute('Publisher', $env:MSIX_PUBLISHER)
          $manifest.Save($manifestPath)

          "MSIX_SIGNING_CERT_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned WinUI analyzer
        shell: pwsh
        run: ./tools/Install-WinUIAnalyzer.ps1

      - name: Build MSIX
        shell: pwsh
        run: dotnet build .\src\DeviceOffboardingManager.WinUI\DeviceOffboardingManager.WinUI.csproj -c Release -p:Platform=${{ matrix.platform }} -p:VersionPrefix=$env:VERSION_PREFIX -p:AppxPackageVersion=$env:APPX_PACKAGE_VERSION -p:WinUIAnalyzerPath="$PWD\artifacts\winui-analyzer" -p:GenerateAppxPackageOnBuild=true -p:AppxPackageDir=..\..\artifacts\ -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxBundle=Never -p:AppxPackageSigningEnabled=false

      - name: Sign and verify MSIX packages
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          MSIX_SIGNING_CERT_PASSWORD: ${{ secrets.MSIX_SIGNING_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw 'signtool.exe was not found in the Windows SDK.'
          }

          $packages = @(Get-ChildItem -Path '.\artifacts' -Filter '*.msix' -Recurse)
          if ($packages.Count -eq 0) {
            throw 'No MSIX packages found under artifacts.'
          }

          foreach ($package in $packages) {
            & $signtool.FullName sign /fd SHA256 /f $env:MSIX_SIGNING_CERT_PFX_PATH /p $env:MSIX_SIGNING_CERT_PASSWORD /tr https://timestamp.digicert.com /td SHA256 $package.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed for $($package.Name) with exit code $LASTEXITCODE."
            }

            & $signtool.FullName verify /pa /v $package.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed for $($package.Name) with exit code $LASTEXITCODE."
            }
          }

      - name: Delete signing certificate
        if: ${{ always() && env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        run: |
          $pfxPath = $env:MSIX_SIGNING_CERT_PFX_PATH
          if ([string]::IsNullOrWhiteSpace($pfxPath)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'msix-signing-cert.pfx'
          }
          if (Test-Path $pfxPath) {
            Remove-Item -Path $pfxPath -Force
          }

      - name: Upload signed MSIX artifact
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msix-signed-${{ matrix.platform }}
          path: artifacts/**/*.msix
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned validation artifact
        if: ${{ env.HAS_SIGNING_CERT != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msix-unsigned-validation-only-${{ matrix.platform }}
          path: artifacts/**/*.msix
          if-no-files-found: error
          retention-days: 3

      - name: Attach signed MSIX to draft release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_CERT == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: artifacts/**/*.msix
          fail_on_unmatched_files: true
