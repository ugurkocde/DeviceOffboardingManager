name: Verify WinUI Scaffold

on:
  pull_request:
  push:
    branches:
      - codex/v0.4-winui-app

jobs:
  verify-winui-scaffold:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify WinUI scaffold
        shell: pwsh
        run: ./tests/Verify-WinUIScaffold.ps1 | Format-List
